name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install OPA
        run: |
          curl -sSfL https://openpolicyagent.org/downloads/v1.22.0/opa_linux_amd64_static -o /tmp/opa
          sudo install /tmp/opa /usr/local/bin/opa
          opa version
      - run: opa test policies/opa
      - run: python -m pip install --no-cache-dir pytest
      - run: pytest tests/ -v
